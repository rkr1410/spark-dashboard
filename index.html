<!doctype html>
<html lang="en" data-theme="gruvbox-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spark Dashboard</title>
    <link rel="stylesheet" href="./src/styles/theme.css?v=20260622-memory-hidden-5" />
    <link rel="stylesheet" href="./src/styles/base.css?v=20260622-memory-hidden-5" />
    <link rel="stylesheet" href="./src/styles/layout.css?v=20260622-memory-hidden-5" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <p class="brand-title">HAL-9000</p>
          <p class="brand-subtitle">Hello, Dave</p>
        </div>
      </div>
      <div class="topbar-status">
        <span class="status-dot" aria-hidden="true"></span>
        <span data-updated-at>Mock data</span>
      </div>
    </header>

    <main class="app-shell" aria-label="Spark Dashboard">
      <section class="dashboard-frame">
        <section class="metric-row" aria-label="System overview">
          <aside class="metric-side">
            <p class="section-label">System</p>
            <div class="micro-metric" data-tone="temp">
              <div class="micro-metric-head">
                <div class="micro-value">
                  <strong data-value="system.temp">46 C</strong>
                </div>
              </div>
              <svg class="micro-chart" viewBox="0 0 180 44" preserveAspectRatio="none" aria-hidden="true">
                <defs>
                  <clipPath id="system-temp-safe-clip">
                    <rect data-clip-band="safe" x="0" y="18.3" width="180" height="25.7" />
                  </clipPath>
                  <clipPath id="system-temp-warn-clip">
                    <rect data-clip-band="warn" x="0" y="10.3" width="180" height="8" />
                  </clipPath>
                  <clipPath id="system-temp-danger-clip">
                    <rect data-clip-band="danger" x="0" y="0" width="180" height="10.3" />
                  </clipPath>
                </defs>
                <polyline class="sparkline-path sparkline-safe" data-sparkline-band="system.temp" clip-path="url(#system-temp-safe-clip)" points="0,27 18,26 36,28 54,24 72,25 90,21 108,23 126,19 144,22 162,18 180,20" />
                <polyline class="sparkline-path sparkline-warn" data-sparkline-band="system.temp" clip-path="url(#system-temp-warn-clip)" points="0,27 18,26 36,28 54,24 72,25 90,21 108,23 126,19 144,22 162,18 180,20" />
                <polyline class="sparkline-path sparkline-danger" data-sparkline-band="system.temp" clip-path="url(#system-temp-danger-clip)" points="0,27 18,26 36,28 54,24 72,25 90,21 108,23 126,19 144,22 162,18 180,20" />
              </svg>
            </div>
            <div class="cpu-core-panel" data-cpu-cores aria-label="CPU core utilization">
              <div class="cpu-core-head">
                <span>CPU</span>
                <strong data-value="system.cpu.avg">50%</strong>
              </div>
              <div class="cpu-core-grid" data-cpu-core-grid>
                <span class="cpu-core" data-cpu-core="0"><span class="cpu-core-fill" style="height: 48%"></span></span>
                <span class="cpu-core" data-cpu-core="1"><span class="cpu-core-fill" style="height: 52%"></span></span>
                <span class="cpu-core" data-cpu-core="2"><span class="cpu-core-fill" style="height: 49%"></span></span>
                <span class="cpu-core" data-cpu-core="3"><span class="cpu-core-fill" style="height: 53%"></span></span>
                <span class="cpu-core" data-cpu-core="4"><span class="cpu-core-fill" style="height: 47%"></span></span>
                <span class="cpu-core" data-cpu-core="5"><span class="cpu-core-fill" style="height: 51%"></span></span>
                <span class="cpu-core" data-cpu-core="6"><span class="cpu-core-fill" style="height: 50%"></span></span>
                <span class="cpu-core" data-cpu-core="7"><span class="cpu-core-fill" style="height: 54%"></span></span>
                <span class="cpu-core" data-cpu-core="8"><span class="cpu-core-fill" style="height: 46%"></span></span>
                <span class="cpu-core" data-cpu-core="9"><span class="cpu-core-fill" style="height: 52%"></span></span>
                <span class="cpu-core" data-cpu-core="10"><span class="cpu-core-fill" style="height: 49%"></span></span>
                <span class="cpu-core" data-cpu-core="11"><span class="cpu-core-fill" style="height: 55%"></span></span>
                <span class="cpu-core" data-cpu-core="12"><span class="cpu-core-fill" style="height: 48%"></span></span>
                <span class="cpu-core" data-cpu-core="13"><span class="cpu-core-fill" style="height: 51%"></span></span>
                <span class="cpu-core" data-cpu-core="14"><span class="cpu-core-fill" style="height: 50%"></span></span>
                <span class="cpu-core" data-cpu-core="15"><span class="cpu-core-fill" style="height: 53%"></span></span>
                <span class="cpu-core" data-cpu-core="16"><span class="cpu-core-fill" style="height: 47%"></span></span>
                <span class="cpu-core" data-cpu-core="17"><span class="cpu-core-fill" style="height: 52%"></span></span>
                <span class="cpu-core" data-cpu-core="18"><span class="cpu-core-fill" style="height: 49%"></span></span>
                <span class="cpu-core" data-cpu-core="19"><span class="cpu-core-fill" style="height: 51%"></span></span>
              </div>
            </div>
          </aside>
          <div class="metric-hero">
            <p class="panel-title">System Memory</p>
            <div class="gauge gauge-memory" data-gauge="system.memory" role="img" aria-label="System memory usage 3.31 GB of 128 GB">
              <svg class="gauge-arc" viewBox="0 0 240 136" aria-hidden="true">
                <path class="gauge-track" pathLength="100" d="M 24 112 A 96 96 0 0 1 216 112" />
                <path class="gauge-memory-free" pathLength="100" d="M 16 112 A 104 104 0 0 1 224 112" />
                <path class="gauge-memory-pressure-track" pathLength="100" d="M 34 112 A 86 86 0 0 1 206 112" />
                <path class="gauge-memory-resident" data-gauge-resident pathLength="100" d="M 16 112 A 104 104 0 0 1 224 112" />
                <path class="gauge-memory-pressure" data-gauge-pressure pathLength="100" d="M 34 112 A 86 86 0 0 1 206 112" />
              </svg>
              <div class="gauge-reading">
                <strong data-gauge-main>3.31 GB</strong>
                <span data-gauge-sub>128 GB total</span>
              </div>
            </div>
          </div>
          <div class="metric-chart">
            <div class="history-chart" data-history="system.memory" role="img" aria-label="System memory history for the last minute">
              <div class="history-labels">
                <span data-history-max>128 GB</span>
                <span>Last 60s</span>
              </div>
              <svg viewBox="0 0 360 126" preserveAspectRatio="none" aria-hidden="true">
                <polygon class="history-area" data-history-area points="0,112 0,108 40,109 80,108 120,109 160,107 200,108 240,107 280,108 320,106 360,107 360,112" />
                <polyline class="history-line" data-history-line points="0,108 40,109 80,108 120,109 160,107 200,108 240,107 280,108 320,106 360,107" />
                <g class="history-points" data-history-points>
                  <circle cx="0" cy="108" r="3" />
                  <circle cx="40" cy="109" r="3" />
                  <circle cx="80" cy="108" r="3" />
                  <circle cx="120" cy="109" r="3" />
                  <circle cx="160" cy="107" r="3" />
                  <circle cx="200" cy="108" r="3" />
                  <circle cx="240" cy="107" r="3" />
                  <circle cx="280" cy="108" r="3" />
                  <circle cx="320" cy="106" r="3" />
                  <circle cx="360" cy="107" r="3" />
                </g>
              </svg>
            </div>
          </div>
        </section>

        <section class="metric-row" aria-label="GPU overview">
          <aside class="metric-side">
            <p class="section-label">GPU</p>
            <div class="micro-metric" data-tone="temp">
              <div class="micro-metric-head">
                <div class="micro-value">
                  <strong data-value="gpu.temp">42 C</strong>
                </div>
              </div>
              <svg class="micro-chart" viewBox="0 0 180 44" preserveAspectRatio="none" aria-hidden="true">
                <defs>
                  <clipPath id="gpu-temp-safe-clip">
                    <rect data-clip-band="safe" x="0" y="18.3" width="180" height="25.7" />
                  </clipPath>
                  <clipPath id="gpu-temp-warn-clip">
                    <rect data-clip-band="warn" x="0" y="10.3" width="180" height="8" />
                  </clipPath>
                  <clipPath id="gpu-temp-danger-clip">
                    <rect data-clip-band="danger" x="0" y="0" width="180" height="10.3" />
                  </clipPath>
                </defs>
                <polyline class="sparkline-path sparkline-safe" data-sparkline-band="gpu.temp" clip-path="url(#gpu-temp-safe-clip)" points="0,24 18,25 36,24 54,23 72,24 90,22 108,23 126,21 144,22 162,20 180,21" />
                <polyline class="sparkline-path sparkline-warn" data-sparkline-band="gpu.temp" clip-path="url(#gpu-temp-warn-clip)" points="0,24 18,25 36,24 54,23 72,24 90,22 108,23 126,21 144,22 162,20 180,21" />
                <polyline class="sparkline-path sparkline-danger" data-sparkline-band="gpu.temp" clip-path="url(#gpu-temp-danger-clip)" points="0,24 18,25 36,24 54,23 72,24 90,22 108,23 126,21 144,22 162,20 180,21" />
              </svg>
            </div>
            <div class="micro-metric" data-tone="power">
              <div class="micro-metric-head">
                <div class="micro-value">
                  <strong data-value="gpu.power">3 W</strong>
                </div>
              </div>
              <svg class="micro-chart" viewBox="0 0 180 44" preserveAspectRatio="none" aria-hidden="true">
                <polyline class="sparkline-path" data-sparkline="gpu.power" points="0,34 18,33 36,34 54,32 72,33 90,31 108,32 126,30 144,31 162,29 180,30" />
              </svg>
            </div>
          </aside>
          <div class="metric-hero">
            <p class="panel-title">GPU Utilization</p>
            <div class="gauge" data-gauge="gpu.utilization" role="img" aria-label="GPU utilization 0 percent">
              <svg class="gauge-arc" viewBox="0 0 240 136" aria-hidden="true">
                <path class="gauge-track" pathLength="100" d="M 24 112 A 96 96 0 0 1 216 112" />
                <path class="gauge-band gauge-band-safe" pathLength="100" d="M 24 112 A 96 96 0 0 1 216 112" />
                <path class="gauge-band gauge-band-warn" pathLength="100" d="M 24 112 A 96 96 0 0 1 216 112" />
                <path class="gauge-band gauge-band-danger" pathLength="100" d="M 24 112 A 96 96 0 0 1 216 112" />
                <path class="gauge-value gauge-value-empty" data-gauge-value pathLength="100" d="M 24 112 A 96 96 0 0 1 216 112" />
              </svg>
              <div class="gauge-reading">
                <strong data-gauge-main>0%</strong>
                <span data-gauge-sub>GPU active</span>
              </div>
            </div>
          </div>
          <div class="metric-chart">
            <div class="history-chart" data-history="gpu.utilization" role="img" aria-label="GPU utilization history for the last minute">
              <div class="history-labels">
                <span data-history-max>100%</span>
                <span>Last 60s</span>
              </div>
              <svg viewBox="0 0 360 126" preserveAspectRatio="none" aria-hidden="true">
                <polygon class="history-area" data-history-area points="0,112 0,112 40,112 80,112 120,111 160,112 200,112 240,111 280,112 320,112 360,112 360,112" />
                <polyline class="history-line" data-history-line points="0,112 40,112 80,112 120,111 160,112 200,112 240,111 280,112 320,112 360,112" />
                <g class="history-points" data-history-points>
                  <circle cx="0" cy="112" r="3" />
                  <circle cx="40" cy="112" r="3" />
                  <circle cx="80" cy="112" r="3" />
                  <circle cx="120" cy="111" r="3" />
                  <circle cx="160" cy="112" r="3" />
                  <circle cx="200" cy="112" r="3" />
                  <circle cx="240" cy="111" r="3" />
                  <circle cx="280" cy="112" r="3" />
                  <circle cx="320" cy="112" r="3" />
                  <circle cx="360" cy="112" r="3" />
                </g>
              </svg>
            </div>
          </div>
        </section>

        <section class="llm-shell" aria-label="LLM runtime">
          <div>
            <p class="section-label">LLM Runtime</p>
            <h2>vLLM metrics</h2>
          </div>
          <div class="llm-grid">
            <div class="llm-slot"></div>
            <div class="llm-slot"></div>
            <div class="llm-slot"></div>
            <div class="llm-slot"></div>
          </div>
        </section>
      </section>
    </main>
    <script src="./src/scripts/mock-data.js?v=20260622-memory-hidden-5" defer></script>
    <script src="./src/scripts/render.js?v=20260622-memory-hidden-5" defer></script>
    <script src="./src/scripts/app.js?v=20260622-memory-hidden-5" defer></script>
  </body>
</html>
